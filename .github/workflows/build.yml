name: build

# Produces downloadable builds of Space Z:
#   - space-z.love          universal LÖVE package (desktop + Android LÖVE player)
#   - SpaceZ-*-windows-x64  standalone Windows folder (exe + DLLs), zipped
#   - SpaceZ-*-debug.apk    debug-signed Android APK, installs directly on a device
#
# Every push to main auto-bumps the patch version (first release is v0.0.1), tags the
# commit, and publishes a GitHub Release with all three attached — permanent, public
# download links, no GitHub account needed. Put "#minor" or "#major" in the commit
# message for a bigger bump. Pushing a v* tag by hand releases that exact version.
# Pull requests build the same artifacts but publish nothing.
#
# Build logic lives in build/*.ps1 (the same scripts used locally on Windows); the
# runners execute them with pwsh, which is preinstalled on GitHub's ubuntu images.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release (bumps the version) instead of artifacts only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # never cancel a run that is going to publish — only PR rebuilds are disposable
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Run test suite
        run: lua5.1 tests/run.lua

  version:
    name: resolve version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need the tag history to find the previous release

      # Tag push v1.2.3        -> 1.2.3, released under that tag.
      # Push to main           -> previous tag + 1 patch (or #minor / #major), released.
      # Anything else          -> <next>-dev.<run number>, artifacts only.
      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            release=true
          else
            # highest existing vMAJOR.MINOR.PATCH tag; empty on a fresh repo
            latest=$(git tag -l --sort=-v:refname \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

            if [[ -z "$latest" ]]; then
              version="0.0.1"
              echo "no release tags yet -> starting at $version"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              msg=$(git log -1 --pretty=%B)
              case "$msg" in
                *'#major'*) major=$((major + 1)); minor=0; patch=0 ;;
                *'#minor'*) minor=$((minor + 1)); patch=0 ;;
                *)          patch=$((patch + 1)) ;;
              esac
              version="$major.$minor.$patch"
              echo "previous release $latest -> $version"
            fi

            if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]] \
               || [[ "${{ inputs.release }}" == "true" ]]; then
              release=true
            else
              release=false
              version="$version-dev.$GITHUB_RUN_NUMBER"
            fi
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            # Android requires an ever-increasing integer; run_number never repeats
            echo "version_code=$GITHUB_RUN_NUMBER"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "building $version (code $GITHUB_RUN_NUMBER, release=$release)"

  package:
    name: package .love
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package space-z.love
        shell: pwsh
        run: ./build/make-love.ps1

      # a corrupt archive would otherwise surface as a broken exe/apk much later
      - name: Verify archive
        run: |
          unzip -t dist/space-z.love
          unzip -l dist/space-z.love | head -n 20

      - uses: actions/upload-artifact@v4
        with:
          name: space-z-love
          path: dist/space-z.love
          if-no-files-found: error

  windows:
    name: windows exe
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download LÖVE 11.5 (win64)
        run: |
          curl -fsSL -o love-win64.zip \
            https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip
          unzip -q love-win64.zip

      # SpaceZ.exe = love.exe with space-z.love appended; pure byte concatenation,
      # so it cross-builds correctly on Linux
      - name: Fuse exe
        shell: pwsh
        run: ./build/build-windows.ps1 -LoveDir love-11.5-win64

      - name: Zip distribution folder
        run: |
          cd dist/windows
          zip -qr "../../SpaceZ-${{ needs.version.outputs.version }}-windows-x64.zip" .
          cd ../..
          ls -lh SpaceZ-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceZ-windows-x64
          path: SpaceZ-*-windows-x64.zip
          if-no-files-found: error

  android:
    name: android apk
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # love-android pulls a large dependency set and the NDK on first build
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        shell: pwsh
        run: ./build/build-android.ps1 -VersionName '${{ needs.version.outputs.version }}' -VersionCode ${{ needs.version.outputs.version_code }}

      - name: Rename APK
        run: |
          src=$(ls dist/android/*debug*.apk | head -n 1)
          mv "$src" "SpaceZ-${{ needs.version.outputs.version }}-debug.apk"
          ls -lh SpaceZ-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceZ-android-apk
          path: SpaceZ-*-debug.apk
          if-no-files-found: error

  release:
    name: publish release
    if: needs.version.outputs.release == 'true'
    needs: [version, package, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # gh creates the tag at --target when it does not exist yet, so pushes to
      # main need no separate tagging step. Re-runs re-upload into the same release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          ls -lhR artifacts

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists -> replacing assets"
            gh release upload "$TAG" artifacts/*/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Space Z $TAG" \
              --generate-notes \
              artifacts/*/*
          fi

          echo "published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
