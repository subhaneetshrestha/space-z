name: build

# Produces downloadable builds of Space Z:
#   - space-z.love          universal LÖVE package (desktop + Android LÖVE player)
#   - SpaceZ-*-windows-x64  standalone Windows folder (exe + DLLs), zipped
#   - SpaceZ-*-debug.apk    debug-signed Android APK, installs directly on a device
#
# Builds only run when something lands on main. Each build is versioned
# MAJOR.MINOR.BUILD, tagged vMAJOR.MINOR.BUILD, and published as a GitHub Release with
# all three attached — permanent, public download links, no GitHub account needed.
#   MAJOR.MINOR  comes from the VERSION file at the repo root; edit it to move to 1.2, 2.0, ...
#   BUILD        is the workflow run number, so it increases with every build.
# Pull requests only run the tests (the Lua suite, and the same suite plus a smoke run
# inside LÖVE 12); nothing is built or published.
#
# Build logic lives in build/*.ps1 (the same scripts used locally on Windows); the
# runners execute them with pwsh, which is preinstalled on GitHub's ubuntu images.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # never cancel a run that is going to publish — only PR rebuilds are disposable
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Run test suite
        run: lua5.1 tests/run.lua

  # The suite above never touches LÖVE. This runs the same suite, and a full smoke run that
  # really renders (sprite atlas, batches, screenshots), inside the LÖVE 12 pinned in
  # LOVE_VERSION, so a LÖVE problem fails the build instead of showing up on a phone.
  #
  # A runner has no GPU, so OpenGL comes from Mesa's software renderer (llvmpipe), the
  # recipe LÖVE's own CI uses on Windows. Mesa is a prebuilt third-party download, pinned
  # by version and sha256 and verified before use; its three OpenGL DLLs are copied beside
  # lovec.exe, which loads them instead of the system OpenGL for that program only.
  # GALLIUM_DRIVER forces llvmpipe, and --renderers forces OpenGL (LÖVE 12 would otherwise
  # pick Vulkan or D3D), so the result does not depend on what a runner happens to have.
  engine:
    name: engine tests (LÖVE 12)
    runs-on: windows-latest
    env:
      MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/24.2.4/mesa3d-24.2.4-release-msvc.7z
      MESA_SHA256: E3919DE795BEE231EDC88E9C996F2C1851250DFF3BC9B51B9121760AE2250DB0
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned LÖVE (win64)
        id: love
        uses: actions/cache@v4
        with:
          path: dist/love12
          key: love-windows-x64-${{ hashFiles('LOVE_VERSION') }}

      - name: Fetch pinned LÖVE (win64)
        if: steps.love.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/get-love.ps1

      # only the three DLLs OpenGL needs are kept (the archive is 650 MB unpacked)
      - name: Restore Mesa software OpenGL
        id: mesa
        uses: actions/cache@v4
        with:
          path: dist/mesa
          key: mesa-gl-${{ env.MESA_SHA256 }}

      - name: Fetch Mesa software OpenGL
        if: steps.mesa.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -sSL --fail -o mesa.7z $env:MESA_URL
          if ($LASTEXITCODE -ne 0) { throw "could not download Mesa" }
          $actual = (Get-FileHash mesa.7z -Algorithm SHA256).Hash
          if ($actual -ne $env:MESA_SHA256) { throw "Mesa checksum mismatch: got $actual, pinned $env:MESA_SHA256" }
          7z x mesa.7z -omesa x64/opengl32.dll x64/libgallium_wgl.dll x64/libglapi.dll -y
          if ($LASTEXITCODE -ne 0) { throw "could not unpack Mesa" }
          New-Item -ItemType Directory -Force dist/mesa | Out-Null
          Copy-Item mesa/x64/opengl32.dll, mesa/x64/libgallium_wgl.dll, mesa/x64/libglapi.dll dist/mesa

      # In a copy of the LÖVE folder, never in dist/love12 itself: that folder is cached under
      # a key the windows job shares, and build-windows.ps1 ships every DLL in it, so Mesa's
      # OpenGL would end up in a release.
      - name: Put the software OpenGL beside lovec.exe
        shell: pwsh
        run: |
          Copy-Item dist/love12 dist/engine -Recurse
          Copy-Item dist/mesa/*.dll dist/engine

      # lovec.exe prints to the console and exits non-zero when a test fails
      - name: Run the suite inside LÖVE
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          & dist/engine/lovec.exe . --test --renderers opengl 2>&1 | Tee-Object -Variable out
          $code = $LASTEXITCODE
          if (-not ($out -match "llvmpipe")) { throw "the suite did not run on Mesa's llvmpipe renderer (see the [renderer] line above)" }
          if ($code -ne 0) { throw "the suite failed inside LÖVE (exit code $code)" }

      # a full simulated run with real rendering; exit code 1 on any error
      - name: Smoke run inside LÖVE
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          & dist/engine/lovec.exe . --smoke --renderers opengl 2>&1 | Tee-Object -Variable out
          $code = $LASTEXITCODE
          $dir = Join-Path $env:APPDATA "LOVE/space-z"
          if (Test-Path "$dir/smoke_report.txt") { Get-Content "$dir/smoke_report.txt" }
          if ($code -ne 0) { throw "the smoke run failed inside LÖVE (exit code $code)" }

      - name: Keep the smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            ~/AppData/Roaming/LOVE/space-z/smoke_*.png
            ~/AppData/Roaming/LOVE/space-z/smoke_report.txt
          if-no-files-found: ignore

  version:
    name: resolve version
    needs: [test, engine]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      version_code: ${{ steps.resolve.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail

          base=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must look like 1.1 (MAJOR.MINOR), got '$base'" >&2
            exit 1
          fi

          version="$base.$GITHUB_RUN_NUMBER"
          {
            echo "version=$version"
            echo "tag=v$version"
            # Android requires an ever-increasing integer; run_number never repeats
            echo "version_code=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "building $version"

  package:
    name: package .love
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package space-z.love
        shell: pwsh
        run: ./build/make-love.ps1

      # a corrupt archive would otherwise surface as a broken exe/apk much later
      - name: Verify archive
        run: |
          unzip -t dist/space-z.love
          unzip -l dist/space-z.love | head -n 20

      - uses: actions/upload-artifact@v4
        with:
          name: space-z-love
          path: dist/space-z.love
          if-no-files-found: error

  windows:
    name: windows exe
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LÖVE 12 has no release yet: its Windows build is an artifact of love2d/love's own CI,
      # for the commit pinned in LOVE_VERSION. Cached on that file, so a run only refetches
      # when the pin changes (artifacts expire after about 90 days; the cache keeps the
      # build as long as it is used at least weekly).
      - name: Restore pinned LÖVE (win64)
        id: love
        uses: actions/cache@v4
        with:
          path: dist/love12
          key: love-windows-x64-${{ hashFiles('LOVE_VERSION') }}

      - name: Fetch pinned LÖVE (win64)
        if: steps.love.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/get-love.ps1

      # SpaceZ.exe = love.exe with space-z.love appended; pure byte concatenation,
      # so it cross-builds correctly on Linux
      - name: Fuse exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/build-windows.ps1

      - name: Zip distribution folder
        run: |
          cd dist/windows
          zip -qr "../../SpaceZ-${{ needs.version.outputs.version }}-windows-x64.zip" .
          cd ../..
          ls -lh SpaceZ-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceZ-windows-x64
          path: SpaceZ-*-windows-x64.zip
          if-no-files-found: error

  android:
    name: android apk
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # build-android.ps1 clones love-android unpinned, so upstream HEAD is what
      # decides whether cached native objects are still valid.
      - name: Resolve love-android revision
        id: upstream
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/love2d/love-android HEAD | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "love-android HEAD is $sha"

      # Of this job's ~22 min, the clone is 21s and the Gradle download 4s — the
      # rest is CMake/ninja compiling LÖVE + megasource for three ABIs into
      # app/.cxx. So caching ~/.gradle alone bought nothing; the whole love-android
      # tree has to come back:
      #   app/.cxx      the object files themselves
      #   .gradle/      Gradle's up-to-date snapshots, or every task re-runs anyway
      #   .git + cpp/   restored together so ninja sees sources OLDER than objects;
      #                 a fresh clone would give newer mtimes and rebuild the lot
      # Keyed on upstream HEAD because that is what the native sources come from.
      # The game itself is not an input here — game.love is copied in later and
      # only invalidates the asset, dex and packaging tasks.
      - name: Restore Android build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            dist/android-build/love-android
          key: android-${{ runner.os }}-${{ steps.upstream.outputs.sha }}-${{ hashFiles('build/build-android.ps1') }}
          restore-keys: android-${{ runner.os }}-${{ steps.upstream.outputs.sha }}-

      - name: Build APK
        shell: pwsh
        run: ./build/build-android.ps1 -VersionName '${{ needs.version.outputs.version }}' -VersionCode ${{ needs.version.outputs.version_code }}

      - name: Rename APK
        run: |
          src=$(ls dist/android/*debug*.apk | head -n 1)
          mv "$src" "SpaceZ-${{ needs.version.outputs.version }}-debug.apk"
          ls -lh SpaceZ-*.apk

      # Saved only after a green build and only when the exact key is new, so a
      # half-written .cxx from a failed run never becomes what everyone restores,
      # and an unchanged upstream does not re-upload gigabytes every push.
      - name: Save Android build cache
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            dist/android-build/love-android
          key: android-${{ runner.os }}-${{ steps.upstream.outputs.sha }}-${{ hashFiles('build/build-android.ps1') }}

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceZ-android-apk
          path: SpaceZ-*-debug.apk
          if-no-files-found: error

  release:
    name: publish release
    needs: [version, package, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need the tag and commit history to build the changelog

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Changelog = every commit on main since the previous release tag, one bullet
      # per commit (merge commits skipped; squash/PR titles and direct commits show).
      - name: Build changelog
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          prev=$(git tag -l --sort=-v:refname \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -n 1 || true)

          if [[ -n "$prev" ]]; then
            range="$prev..$GITHUB_SHA"
            heading="Changes since $prev"
          else
            range="$GITHUB_SHA"
            heading="Changes"
          fi

          {
            echo "## $heading"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range" | head -n 100
          } > CHANGELOG.md
          cat CHANGELOG.md

      # gh creates the tag at --target when it does not exist yet, so pushes to
      # main need no separate tagging step. Re-runs re-upload into the same release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          ls -lhR artifacts

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists -> replacing assets"
            gh release upload "$TAG" artifacts/*/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file CHANGELOG.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Space Z $TAG" \
              --notes-file CHANGELOG.md \
              artifacts/*/*
          fi

          echo "published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
